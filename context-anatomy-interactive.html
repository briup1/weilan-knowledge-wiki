<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上下文工程 · 交互式剖面图</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --elevated: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent-blue: #58a6ff;
      --accent-orange: #f0883e;
      --accent-green: #7ee787;
      --accent-purple: #a371f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #scene-bar { background: var(--elevated); border-bottom: 1px solid var(--border); padding: 10px 20px; font-size: 14px; }
    .main-layout { display: flex; flex: 1; min-height: 0; }
    #stack-panel { flex: 2; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    #detail-panel { flex: 1; background: var(--surface); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
    #control-bar { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    @media (max-width: 1279px) {
      .main-layout { flex-direction: column; }
      #detail-panel { border-left: none; border-top: 1px solid var(--border); max-height: 40vh; }
    }
    .section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .layer-list { display: flex; flex-direction: column; gap: 8px; }
    .layer-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.25s ease; }
    .layer-row:hover { border-color: var(--layer-color); }
    .layer-row.active { border-color: var(--layer-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--layer-color) 20%, transparent); }
    .layer-row.inactive { opacity: 0.35; }
    .layer-number { font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace; font-size: 12px; color: var(--layer-color); min-width: 36px; }
    .layer-name { font-weight: 600; font-size: 15px; min-width: 110px; }
    .layer-short { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .round-timeline { margin-top: auto; }
    .round-list { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .round-pill { padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .round-pill.current { background: var(--accent-blue); color: var(--bg); font-weight: 700; }
    .round-pill.passed { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }
    .round-pill.future { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .round-arrow { color: var(--border); font-size: 12px; }
    #detail-panel h2 { font-size: 20px; }
    .detail-scenario { color: var(--text); line-height: 1.7; font-size: 14px; margin-bottom: 20px; }
    .detail-live, .detail-code, .detail-points { margin-bottom: 20px; }
    .code-block { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: var(--text); }
    .detail-points ul { color: var(--muted); font-size: 13px; line-height: 1.8; padding-left: 20px; }
    .detail-points li { margin-bottom: 6px; }
    .layer-row.selected { background: var(--elevated); outline: 2px solid var(--layer-color); outline-offset: 2px; }
    .placeholder-text { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .layer-row { animation: slideIn 0.3s ease both; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    #control-bar button { background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    #control-bar button:hover { border-color: var(--accent-blue); }
    #control-bar button:active { background: var(--surface); }
    #control-bar button.active { border-color: var(--accent-green); color: var(--accent-green); }
    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; cursor: pointer; transition: all 0.2s ease; }
    .overview-card:hover { border-color: var(--layer-color); transform: translateY(-2px); }
    .overview-card.selected { outline: 2px solid var(--layer-color); outline-offset: 2px; }
    .overview-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .overview-card-desc { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <div id="app">
    <div id="scene-bar"><strong>场景：</strong>智能客服退款智能体</div>
    <div class="main-layout">
      <div id="stack-panel"></div>
      <div id="detail-panel">
        <div class="placeholder-text">点击左侧任意层级查看详情，或使用底部控制条播放对话过程。</div>
      </div>
    </div>
    <div id="control-bar">
      <button type="button" id="btn-prev">← 上一回合</button>
      <button type="button" id="btn-next">下一回合 →</button>
      <button type="button" id="btn-reset">重置</button>
      <div style="width: 1px; height: 20px; background: var(--border);"></div>
      <span style="color: var(--muted); font-size: 12px;">自动播放：</span>
      <button type="button" data-speed="3000">3 秒</button>
      <button type="button" data-speed="5000">5 秒</button>
      <button type="button" data-speed="10000">10 秒</button>
      <button type="button" id="btn-overview" style="margin-left: auto;">查看完整剖面</button>
      <span id="progress" style="font-size: 12px; color: var(--muted);">第 1 / 4 回合</span>
    </div>
  </div>
  <script>
    let currentRound = 0;
    let autoPlayTimer = null;
    let isOverviewMode = false;

    const layerDefinitions = {
      'static-prefix': { id: 'static-prefix', label: '静态前缀', short: '系统提示词 + 工具模式', color: '#f0883e', layer: 1 },
      'user': { id: 'user', label: '用户输入', short: '用户输入 + 元信息', color: '#7ee787', layer: 2 },
      'assistant': { id: 'assistant', label: '模型回复', short: '模型回复 / 工具调用', color: '#a371f7', layer: 3 },
      'tool-result': { id: 'tool-result', label: '工具结果', short: '工具执行结果', color: '#58a6ff', layer: 4 },
      'state-bar': { id: 'state-bar', label: '状态栏', short: '显式状态栏', color: '#c9d1d9', layer: 5 },
      'skill-metadata': { id: 'skill-metadata', label: '技能元数据', short: '动态技能元数据', color: '#c9d1d9', layer: 6 },
      'compaction-summary': { id: 'compaction-summary', label: '压缩摘要', short: '压缩摘要层', color: '#c9d1d9', layer: 7 }
    };

    const script = [
      {
        round: 1,
        title: '用户发起退款',
        activeLayers: ['static-prefix', 'user', 'assistant', 'tool-result'],
        userMessage: '我想退掉昨天买的耳机',
        assistantAction: '理解意图，调用 query_order',
        toolResult: '订单 #20240728：蓝牙耳机，金额 ¥299，购买时间 2024-07-27',
        stateBar: { task: '处理退款', orderVerified: false, refundMethod: null },
        skillLoaded: null,
        compaction: null
      },
      {
        round: 2,
        title: '查询退款政策',
        activeLayers: ['static-prefix', 'user', 'assistant', 'tool-result', 'state-bar'],
        userMessage: null,
        assistantAction: '调用 check_policy',
        toolResult: '7 天内未拆封可退',
        stateBar: { task: '处理退款', orderVerified: true, policyChecked: true, refundMethod: null },
        skillLoaded: null,
        compaction: null
      },
      {
        round: 3,
        title: '确认退款方式',
        activeLayers: ['static-prefix', 'user', 'assistant', 'tool-result', 'state-bar', 'skill-metadata'],
        userMessage: '退到原支付账户',
        assistantAction: '调用 process_refund',
        toolResult: '退款已提交，预计 1-3 个工作日到账',
        stateBar: { task: '处理退款', orderVerified: true, policyChecked: true, refundMethod: '原支付账户' },
        skillLoaded: '客服退款流程技能',
        compaction: null
      },
      {
        round: 4,
        title: '完成并总结',
        activeLayers: ['static-prefix', 'user', 'assistant', 'tool-result', 'state-bar', 'skill-metadata', 'compaction-summary'],
        userMessage: null,
        assistantAction: '总结并回复用户',
        toolResult: null,
        stateBar: { task: '完成', orderVerified: true, refundProcessed: true },
        skillLoaded: '客服退款流程技能',
        compaction: '用户要求退耳机；订单 #20240728 已验证；政策允许；退款至原支付账户，1-3 个工作日到账。'
      }
    ];

    const layerDetails = {
      'static-prefix': {
        title: '静态前缀',
        scenario: '在客服退款场景中，静态前缀定义了智能体的身份（"你是客服助手"）和可用工具（query_order / check_policy / process_refund）。',
        code: `{
  "role": "system",
  "content": "你是客服助手，帮助用户处理退款。可用工具：query_order, check_policy, process_refund。"
}`,
        points: [
          '系统提示词 + 工具模式共同构成静态前缀',
          '前缀在每一轮请求中保持不变，是 KV 缓存的基础',
          '不要在 <code>system</code> 中注入动态时间戳，否则会破坏缓存'
        ]
      },
      'user': {
        title: '用户输入',
        scenario: '用户说"我想退掉昨天买的耳机"，这条消息被追加到上下文末尾，同时也可能携带框架注入的元信息（如用户 ID、会话 ID）。',
        code: `{
  "role": "user",
  "content": "我想退掉昨天买的耳机"
}`,
        points: [
          '<code>user</code> 角色承载真实用户输入',
          '框架也可以在这里注入元信息',
          '每次请求都追加到上下文末尾，不改变前缀'
        ]
      },
      'assistant': {
        title: '模型回复',
        scenario: '智能体理解了退款意图，决定先查询订单。它在 <code>assistant</code> 角色中输出思考过程和 <code>tool_calls</code>。',
        code: `{
  "role": "assistant",
  "content": "用户想退款，我需要先查询订单信息。",
  "tool_calls": [{"id": "call_001", "function": {"name": "query_order"}}]
}`,
        points: [
          '<code>assistant</code> 角色包含模型回复和 <code>tool_calls</code>',
          'ReAct 循环的推理步骤体现在这里',
          '<code>tool_calls</code> 需要工具结果来闭环'
        ]
      },
      'tool-result': {
        title: '工具结果',
        scenario: 'query_order 返回了订单信息。工具结果通过 <code>tool_call_id</code> 精确关联到模型回复层的调用。',
        code: `{
  "role": "tool",
  "tool_call_id": "call_001",
  "content": "订单 #20240728：蓝牙耳机，金额 ¥299"
}`,
        points: [
          '<code>tool_call_id</code> 是关联模型回复调用和工具结果的关键',
          '工具结果是 ReAct 循环的反馈输入',
          '在长对话中，旧工具结果可能被压缩摘要替代'
        ]
      },
      'state-bar': {
        title: '状态栏',
        scenario: '状态栏是显式状态栏，让模型随时"瞥一眼"当前状态，而不必自己从历史中推断。',
        code: `任务=处理退款 | 订单已验证=true | 政策已确认=true | 退款方式=原支付账户`,
        points: [
          '把隐式状态提炼为显式状态栏',
          '弱模型准确率大幅提升，强模型成本显著下降',
          '状态栏应由代码维护，不要让大语言模型批量统计历史'
        ]
      },
      'skill-metadata': {
        title: '技能元数据',
        scenario: '当对话进入退款流程时，系统加载"客服退款流程技能"的元数据，完整内容按需通过技能工具加载。',
        code: `Skill: 客服退款流程\nDescription: 处理用户退款请求，包括查询订单、核对政策、执行退款。`,
        points: [
          '技能元数据常驻上下文，完整内容按需加载',
          '避免系统提示词膨胀导致的令牌浪费',
          '技能描述应像路由条件，包含反例'
        ]
      },
      'compaction-summary': {
        title: '压缩摘要',
        scenario: '四轮对话结束后，早期细节被压缩成结构化摘要，保留关键事实而丢弃冗余中间信息。',
        code: `用户要求退耳机；订单 #20240728 已验证；政策允许；退款至原支付账户，1-3 个工作日到账。`,
        points: [
          '上下文压缩在超过阈值时触发',
          '压缩产物是结构化的 <code>CompactionEntry</code>',
          '隔离优于压缩：大体积中间信息可用子智能体隔离'
        ]
      }
    };

    function renderStack(roundIndex) {
      currentRound = roundIndex;
      const panel = document.getElementById('stack-panel');
      const round = script[roundIndex] || { activeLayers: ['static-prefix'] };
      const activeSet = new Set(round.activeLayers);

      let html = '<div class="section-label">上下文栈</div>';
      html += '<div class="layer-list">';

      const orderedIds = ['static-prefix', 'user', 'assistant', 'tool-result', 'state-bar', 'skill-metadata', 'compaction-summary'];
      orderedIds.forEach(id => {
        const def = layerDefinitions[id];
        const isActive = activeSet.has(id);
        const roundSpecificData = getLayerData(id, round);
        html += `
          <div class="layer-row ${isActive ? 'active' : 'inactive'}" data-layer="${id}" tabindex="0" role="button" style="--layer-color: ${def.color}">
            <span class="layer-number">第 ${def.layer} 层</span>
            <span class="layer-name">${def.label}</span>
            <span class="layer-short">${roundSpecificData || def.short}</span>
          </div>
        `;
      });

      html += '</div>';

      // Round timeline
      html += '<div class="round-timeline">';
      html += '<div class="section-label">回合时间线</div>';
      html += '<div class="round-list">';
      script.forEach((r, idx) => {
        const cls = idx === roundIndex ? 'current' : (idx < roundIndex ? 'passed' : 'future');
        html += `<div class="round-pill ${cls}" data-round="${idx}">${r.title}</div>`;
        if (idx < script.length - 1) html += '<span class="round-arrow">→</span>';
      });
      html += '</div></div>';

      panel.innerHTML = html;
    }

    function getLayerData(id, round) {
      if (id === 'user' && round.userMessage) return round.userMessage;
      if (id === 'assistant' && round.assistantAction) return round.assistantAction;
      if (id === 'tool-result' && round.toolResult) return round.toolResult;
      if (id === 'state-bar' && round.stateBar) {
        const keyLabels = {
          task: '任务',
          orderVerified: '订单已验证',
          policyChecked: '政策已确认',
          refundMethod: '退款方式',
          refundProcessed: '退款已处理'
        };
        return Object.entries(round.stateBar)
          .filter(([k, v]) => v != null)
          .map(([k, v]) => `${keyLabels[k] || k}=${v}`)
          .join(' | ');
      }
      if (id === 'skill-metadata' && round.skillLoaded) return round.skillLoaded;
      if (id === 'compaction-summary' && round.compaction) return round.compaction;
      return null;
    }

    let currentLayer = null;

    function showDetail(layerId) {
      currentLayer = layerId;
      const detail = layerDetails[layerId];
      const def = layerDefinitions[layerId];
      const round = script[currentRound];
      const panel = document.getElementById('detail-panel');

      let html = `<div class="detail-header" style="border-left: 4px solid ${def.color}; padding-left: 12px; margin-bottom: 20px;">`;
      html += `<h2 style="margin: 0 0 6px 0;">${detail.title}</h2>`;
      html += `<div style="font-size: 12px; color: var(--muted);">第 ${def.layer} 层 · ${def.short}</div>`;
      html += '</div>';

      html += `<p class="detail-scenario">${detail.scenario}</p>`;

      const liveData = getLayerData(layerId, round);
      if (liveData) {
        html += `<div class="detail-live"><div class="section-label">当前轮次实际内容</div><div class="code-block">${escapeHtml(liveData)}</div></div>`;
      }

      html += `<div class="detail-code"><div class="section-label">典型示例</div><pre class="code-block">${escapeHtml(detail.code)}</pre></div>`;

      html += `<div class="detail-points"><div class="section-label">关键要点</div><ul>`;
      detail.points.forEach(p => { html += `<li>${p}</li>`; });
      html += '</ul></div>';

      panel.innerHTML = html;
      highlightSelectedLayer(layerId);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightSelectedLayer(layerId) {
      document.querySelectorAll('.layer-row, .overview-card').forEach(el => {
        el.classList.toggle('selected', el.dataset.layer === layerId);
      });
    }

    function goToRound(roundIndex) {
      isOverviewMode = false;
      document.getElementById('btn-overview').textContent = '查看完整剖面';
      if (roundIndex < 0) roundIndex = 0;
      if (roundIndex >= script.length) roundIndex = script.length - 1;
      currentRound = roundIndex;
      renderStack(currentRound);
      updateProgress();

      const round = script[currentRound];
      const detailLayer = roundIndex === 0 ? 'static-prefix' : round.activeLayers[round.activeLayers.length - 1];
      showDetail(detailLayer);
    }

    function updateProgress() {
      document.getElementById('progress').textContent = `第 ${currentRound + 1} / ${script.length} 回合`;
    }

    function nextRound() {
      if (currentRound < script.length - 1) {
        goToRound(currentRound + 1);
      } else if (autoPlayTimer) {
        stopAutoPlay();
      }
    }

    function prevRound() {
      if (currentRound > 0) {
        goToRound(currentRound - 1);
      }
    }

    function resetRound() {
      stopAutoPlay();
      goToRound(0);
    }

    function initControls() {
      document.getElementById('btn-next').addEventListener('click', nextRound);
      document.getElementById('btn-prev').addEventListener('click', prevRound);
      document.getElementById('btn-reset').addEventListener('click', resetRound);
      document.getElementById('btn-overview').addEventListener('click', () => {
        if (isOverviewMode) exitOverviewMode(); else enterOverviewMode();
      });

      document.querySelectorAll('[data-speed]').forEach(btn => {
        btn.addEventListener('click', () => {
          const speed = parseInt(btn.dataset.speed, 10);
          startAutoPlay(speed);
        });
      });

      const stackPanel = document.getElementById('stack-panel');
      stackPanel.addEventListener('mouseenter', () => {
        if (autoPlayTimer) {
          clearInterval(autoPlayTimer);
          autoPlayTimer = null;
        }
      });
      stackPanel.addEventListener('mouseleave', () => {
        const activeBtn = document.querySelector('[data-speed].active');
        if (activeBtn) {
          startAutoPlay(parseInt(activeBtn.dataset.speed, 10));
        }
      });

      document.getElementById('stack-panel').addEventListener('click', (e) => {
        const layerRow = e.target.closest('.layer-row');
        const overviewCard = e.target.closest('.overview-card');
        const roundPill = e.target.closest('.round-pill');
        if (layerRow) showDetail(layerRow.dataset.layer);
        if (overviewCard) showDetail(overviewCard.dataset.layer);
        if (roundPill) goToRound(parseInt(roundPill.dataset.round, 10));
      });

      document.getElementById('stack-panel').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const layerRow = e.target.closest('.layer-row');
        const overviewCard = e.target.closest('.overview-card');
        if (layerRow || overviewCard) {
          e.preventDefault();
          showDetail((layerRow || overviewCard).dataset.layer);
        }
      });
    }

    function startAutoPlay(intervalMs) {
      stopAutoPlay();
      document.querySelectorAll('[data-speed]').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.speed, 10) === intervalMs);
      });
      if (currentRound >= script.length - 1) {
        goToRound(0);
      }
      autoPlayTimer = setInterval(() => {
        if (currentRound < script.length - 1) {
          nextRound();
        } else {
          stopAutoPlay();
        }
      }, intervalMs);
    }

    function stopAutoPlay() {
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
        autoPlayTimer = null;
      }
      document.querySelectorAll('[data-speed]').forEach(btn => btn.classList.remove('active'));
    }

    function enterOverviewMode() {
      isOverviewMode = true;
      stopAutoPlay();
      const panel = document.getElementById('stack-panel');
      let html = '<div class="section-label">完整上下文剖面 · 点击任意卡片查看详情</div>';
      html += '<div class="overview-grid">';
      const orderedIds = ['static-prefix', 'user', 'assistant', 'tool-result', 'state-bar', 'skill-metadata', 'compaction-summary'];
      orderedIds.forEach(id => {
        const def = layerDefinitions[id];
        const detail = layerDetails[id];
        html += `
          <div class="overview-card" data-layer="${id}" tabindex="0" role="button" style="--layer-color: ${def.color}">
            <div class="overview-card-header">
              <span class="layer-number">第 ${def.layer} 层</span>
              <span class="layer-name">${def.label}</span>
            </div>
            <p class="overview-card-desc">${detail.scenario}</p>
          </div>
        `;
      });
      html += '</div>';
      panel.innerHTML = html;

      if (currentLayer) highlightSelectedLayer(currentLayer);
      document.getElementById('btn-overview').textContent = '返回逐步播放';
    }

    function exitOverviewMode() {
      isOverviewMode = false;
      goToRound(currentRound);
      document.getElementById('btn-overview').textContent = '查看完整剖面';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextRound(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevRound(); }
      else if (e.key === 'Escape') {
        currentLayer = null;
        document.querySelectorAll('.layer-row, .overview-card').forEach(el => el.classList.remove('selected'));
        document.getElementById('detail-panel').innerHTML = '<div class="placeholder-text">点击左侧任意层级查看详情，或使用底部控制条播放对话过程。</div>';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      initControls();
      goToRound(0);
    });
  </script>
</body>
</html>
